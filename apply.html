<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Hostel - UNILAG Hostel Balloting</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <input type="checkbox" id="menuToggle" class="menu-toggle">

  <header class="header">
    <div class="header-left">
      <label for="menuToggle" class="hamburger"><span></span><span></span><span></span></label>
      <img src="images/unilag-logo.png" alt="UNILAG logo" class="logo">
      <span class="header-title">UNIVERSITY OF LAGOS</span>
    </div>
    <div class="avatar">A</div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav>
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <a href="apply.html" class="nav-item active">📝 Apply for Hostel</a>
        <a href="ballot-result.html" class="nav-item">🎲 Ballot Result</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
      </nav>

      <a href="index.html" class="nav-item logout">🚪 Logout</a>
    </aside>

    <label for="menuToggle" class="overlay"></label>

    <main class="main">
      <div class="welcome-banner">
        <h1>Hostel Application</h1>
        <p class="main-subtitle">Select your preferred accommodation choices below</p>
      </div>

      <div class="card form-card">
        <form>
          <div class="form-group">
            <label for="preferred-hall">Preferred Hostel (Choice 1)</label>
            <div class="select-wrapper">
              <select id="preferred-hall" name="preferred-hall" required>
                <option value="">-- Select Preferred Hall --</option>
                <option value="Jaja Hall">Jaja Hall</option>
                <option value="Mariere Hall">Mariere Hall</option>
                <option value="Eni Njoku Hall">Eni Njoku Hall</option>
                <option value="Sodeinde Hall">Sodeinde Hall</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="alternative-hall">Alternative Hostel (Choice 2)</label>
            <div class="select-wrapper">
              <select id="alternative-hall" name="alternative-hall" required>
                <option value="">-- Select Alternative Hall --</option>
                <option value="Jaja Hall">Jaja Hall</option>
                <option value="Mariere Hall">Mariere Hall</option>
                <option value="Eni Njoku Hall">Eni Njoku Hall</option>
                <option value="Sodeinde Hall">Sodeinde Hall</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="special-request">Special Medical / Accessibility Request (Optional)</label>
            <input type="text" id="special-request" placeholder="e.g., Ground floor required">
          </div>

          <button type="submit" class="submit-btn">Submit Application</button>
        </form>
      </div>
    </main>

  </div>

</body>
</html>
