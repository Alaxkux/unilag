<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - UNILAG Hostel Balloting</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <input type="checkbox" id="menuToggle" class="menu-toggle">

  <header class="header">
    <div class="header-left">
      <label for="menuToggle" class="hamburger"><span></span><span></span><span></span></label>
      <img src="images/unilag-logo.png" alt="UNILAG logo" class="logo">
      <span class="header-title">UNIVERSITY OF LAGOS</span>
    </div>
    <div class="avatar">A</div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav>
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <a href="apply.html" class="nav-item">📝 Apply for Hostel</a>
        <a href="ballot-result.html" class="nav-item">🎲 Ballot Result</a>
        <a href="profile.html" class="nav-item active">👤 Profile</a>
      </nav>

      <a href="index.html" class="nav-item logout">🚪 Logout</a>
    </aside>

    <label for="menuToggle" class="overlay"></label>

    <main class="main">
      <h1>Student Profile</h1>
      <p class="main-subtitle">Academic Details</p>

      <div class="card profile-card">
        <div class="profile-info-grid">

          <div class="info-group">
            <span class="info-label">Matric Number</span>
            <span class="info-value">220405012</span>
          </div>

          <div class="info-group">
            <span class="info-label">Faculty</span>
            <span class="info-value">Faculty of Engineering</span>
          </div>

          <div class="info-group">
            <span class="info-label">Department</span>
            <span class="info-value">Systems Engineering</span>
          </div>

          <div class="info-group">
            <span class="info-label">Level</span>
            <span class="info-value">300 Level</span>
          </div>

        </div>
      </div>
    </main>

  </div>

</body>
</html>
